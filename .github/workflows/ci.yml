name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check installed dependencies
        run: python -m pip check

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3
      - name: Report packaged frontend drift
        # Hard fail is handled by Sync frontend static for same-repo branches.
        # Package job always injects this build, so wheels stay correct.
        run: |
          set -euo pipefail
          if diff -qr frontend/dist src/igris/static; then
            echo "src/igris/static matches frontend/dist"
            exit 0
          fi
          echo "::warning::src/igris/static is stale relative to this build."
          echo "The Sync frontend static workflow commits the fix on same-repo branches."
          echo "Package build uses the uploaded frontend-dist artifact regardless."
          diff -qr frontend/dist src/igris/static || true

  package:
    name: Package build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Inject packaged frontend from CI build
        run: bash scripts/sync-frontend-static.sh --skip-install --skip-build
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build==1.3.0
      - name: Validate installer syntax
        run: bash -n packaging/install.sh
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and inspect wheel
        run: |
          python -m venv /tmp/igris-wheel
          /tmp/igris-wheel/bin/pip install dist/*.whl
          /tmp/igris-wheel/bin/python -c "import igris"
          /tmp/igris-wheel/bin/igris-set-password --help >/dev/null
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [python-tests, frontend, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python-tests.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
    steps:
      - name: Enforce required jobs
        run: |
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$PACKAGE_RESULT" = success
