name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check installed dependencies
        run: python -m pip check

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify packaged frontend is current
        run: diff -qr frontend/dist src/igiris/static

  package:
    name: Package build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build frontend
        run: python -m pip install build==1.3.0
      - name: Validate installer syntax
        run: bash -n packaging/install.sh
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and inspect wheel
        run: |
          python -m venv /tmp/igiris-wheel
          /tmp/igiris-wheel/bin/pip install dist/*.whl
          /tmp/igiris-wheel/bin/python -c "import igiris"
          /tmp/igiris-wheel/bin/igiris-set-password --help >/dev/null
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [python-tests, frontend, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python-tests.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
    steps:
      - name: Enforce required jobs
        run: |
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$PACKAGE_RESULT" = success
