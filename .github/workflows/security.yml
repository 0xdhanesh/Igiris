name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          args: --no-git

  sast:
    name: Semgrep and Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanners
        run: python -m pip install bandit==1.9.4 semgrep==1.170.0
      - name: Run Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --exclude .venv \
            --exclude frontend/node_modules \
            --exclude frontend/dist \
            --exclude src/igiris/static \
            .
      - name: Produce complete Bandit report
        continue-on-error: true
        run: bandit -r src/igiris -f json -o bandit-report.json
      - name: Block high-severity Bandit findings
        run: bandit -r src/igiris --severity-level high --confidence-level medium
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Audit Python environment
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          python -m pip install -e . pip-audit==2.10.1
          python -m pip_audit --local
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install workflow auditor
        run: python3 -m pip install zizmor==1.27.0
      - name: Audit workflow definitions
        run: zizmor .github/workflows

  required:
    name: Security required
    if: always()
    needs: [secret-scan, sast, dependencies, workflow-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SECRET_RESULT: ${{ needs.secret-scan.result }}
      SAST_RESULT: ${{ needs.sast.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
      WORKFLOW_RESULT: ${{ needs.workflow-security.result }}
    steps:
      - name: Enforce required jobs
        run: |
          test "$SECRET_RESULT" = success
          test "$SAST_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$WORKFLOW_RESULT" = success
