name: Feature request
description: Propose an investigation, detection, collection, or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Investigation problem
      description: What analyst or authorized assessment problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe expected behavior without assuming an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and attribution considerations
      description: Explain provenance, confidence, lifecycle, and false-attribution risks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorized-use confirmation
      options:
        - label: The proposed use is defensive or limited to systems explicitly authorized for assessment.
          required: true
