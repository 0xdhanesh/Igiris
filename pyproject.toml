[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igris"
version = "1.2.0"
description = "Investigation-focused Linux network process monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psutil>=6,<8",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
igrisd = "igris.main:run"
igris-set-password = "igris.auth_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/igris"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
